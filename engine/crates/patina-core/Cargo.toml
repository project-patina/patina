[package]
name = "patina-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Patina simulation foundations for the pinned vanilla Java Edition target"

[features]
# Records the call sites of LegacyRandom draws (mob AI parity debugging).
rng-trace = []

[dependencies]
libm = "=0.2.16"

[[bin]]
name = "patina-parity"
path = "src/bin/parity.rs"

[[bin]]
name = "patina-tick-parity"
path = "src/bin/tick_parity.rs"

[[bin]]
name = "patina-geometry-parity"
path = "src/bin/geometry_parity.rs"

[[bin]]
name = "patina-noise-parity"
path = "src/bin/noise_parity.rs"

[[bin]]
name = "patina-density-parity"
path = "src/bin/density_parity.rs"

[[bin]]
name = "patina-float-log-parity"
path = "src/bin/float_log_parity.rs"

[lints]
workspace = true
