[package]
name = "amethyst-launcher"
description = "Patina — a minimalist open-source Minecraft launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "amethyst-launcher"

[lib]
name = "amethyst_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enabled by `tauri build`; `tauri dev` continues using the Vite server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
amethyst-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
