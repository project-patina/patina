[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]
exclude = ["engine"]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/project-patina/patina"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev.package."*"]
opt-level = 2
