[package]
name = "amethyst-core"
description = "Tauri-free core of Patina Launcher: downloads, versions, loaders, Java, Microsoft auth and game launching"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "net", "sync", "time"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "charset", "http2", "json", "form", "query", "stream", "gzip", "multipart"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha1 = "0.11"
hex = "0.4"
base64 = "0.23"
zip = { version = "9", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v3", "serde"] }
dirs = "7"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
trash = "5"
log = "0.4"
libc = "0.2"
sha2 = "0.11"
semver = "1"
minisign-verify = "0.3"
self-replace = "1"

[dev-dependencies]
env_logger = "0.11"
minisign = "0.10"
