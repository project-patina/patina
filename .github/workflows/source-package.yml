name: Prepare source archive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Prepare reviewed source selection
        run: python3 scripts/prepare-source-release.py --output "$RUNNER_TEMP/patina-source"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patina-source
          path: |
            ${{ runner.temp }}/patina-source.tar.gz
            ${{ runner.temp }}/patina-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
